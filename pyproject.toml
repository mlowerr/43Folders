[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "43folders"
version = "0.1.0"
description = "Cross-platform dated folder generator: YEAR/MONTH/DAY trees with 00-Archive folders and matching text files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
43folders = "folder43.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"